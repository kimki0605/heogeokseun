
# ========================================
# 프로젝트 기본 설정
# ========================================

# Spring Boot 애플리케이션 이름
spring.application.name=heogeokseun


# ========================================
# Oracle Database
# ========================================

# Oracle XE 데이터베이스 연결 주소
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1

# Oracle 데이터베이스 사용자
spring.datasource.username=HEOGEOKSEUN

# DB 비밀번호는 환경 변수에서 가져온다.
spring.datasource.password=${HEOGEOKSEUN_DB_PASSWORD}

# Oracle JDBC 드라이버
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ========================================
# MyBatis
# ========================================

# SQL 매퍼 XML 파일 위치
mybatis.mapper-locations=classpath:mapper/*.xml

# 도메인 클래스가 위치한 패키지
mybatis.type-aliases-package=com.heogeokseun.domain

# DB의 BOARD_NO를 Java의 boardNo로 자동 변환한다.
mybatis.configuration.map-underscore-to-camel-case=true


# ========================================
# Thymeleaf
# ========================================

# 개발 중 HTML 변경 사항을 즉시 반영한다.
spring.thymeleaf.cache=false


# ========================================
# Gmail SMTP
# ========================================

# Gmail SMTP 서버 정보
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail 계정 및 앱 비밀번호는 환경 변수에서 가져온다.
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

# SMTP 인증 활성화
spring.mail.properties.mail.smtp.auth=true

# 이메일 전송 시 STARTTLS 암호화 사용
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Gmail SMTP 서버 신뢰 설정
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# 이메일 문자 인코딩
spring.mail.default-encoding=UTF-8


# ========================================
# 프로필 이미지 업로드 설정
# ========================================

# 업로드할 수 있는 파일 하나의 최대 크기
spring.servlet.multipart.max-file-size=5MB

# HTTP 요청 전체의 최대 크기
spring.servlet.multipart.max-request-size=6MB

# 프로필 이미지 저장 폴더
app.upload.profile-dir=${user.home}/heogeokseun/uploads/profiles


# ========================================
# JWT 인증 설정
# ========================================

# JWT 서명에 사용할 비밀 키
# Windows 환경 변수 HEOGEOKSEUN_JWT_SECRET에서 가져온다.
# 비밀 키를 소스 코드에 직접 작성하지 않는다.
jwt.secret=${HEOGEOKSEUN_JWT_SECRET}

# JWT Access Token 유효 시간
# 1800000밀리초 = 30분
jwt.access-token-expiration=1800000
