spring.application.name=heogeokseun

# Oracle Database
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=HEOGEOKSEUN
spring.datasource.password=${HEOGEOKSEUN_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.heogeokseun.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf
spring.thymeleaf.cache=false

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.default-encoding=UTF-8

# ========================================
# 프로필 이미지 업로드 설정
# ========================================

# 업로드할 수 있는 파일 하나의 최대 크기
spring.servlet.multipart.max-file-size=5MB

# HTTP 요청 전체의 최대 크기
spring.servlet.multipart.max-request-size=6MB

# 프로필 이미지 저장 폴더
app.upload.profile-dir=${user.home}/heogeokseun/uploads/profiles