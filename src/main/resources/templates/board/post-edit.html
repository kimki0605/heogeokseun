
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게시글 수정 | 허걱슨닷컴</title>

    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">

    <style>
        /* 상단 헤더 */
        .post-edit-header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .post-edit-header-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .post-edit-logo {
            color: #2563eb;
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
        }

        .post-edit-nav {
            display: flex;
            gap: 24px;
        }

        .post-edit-nav a {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .post-edit-nav a:hover {
            color: #2563eb;
        }

        /* 수정 페이지 전체 영역 */
        .post-edit-page {
            max-width: 900px;
            min-height: 70vh;
            margin: 0 auto;
            padding: 55px 24px 100px;
        }

        .post-edit-breadcrumb {
            margin-bottom: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .post-edit-breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }

        /* 페이지 제목 */
        .post-edit-heading {
            padding-bottom: 25px;
            margin-bottom: 35px;
            border-bottom: 1px solid #e2e8f0;
        }

        .post-edit-heading h1 {
            margin-bottom: 12px;
            color: #0f172a;
            font-size: 30px;
            font-weight: 800;
        }

        .post-edit-heading p {
            color: #64748b;
            font-size: 15px;
        }

        /* 입력 폼 */
        .post-edit-field {
            margin-bottom: 28px;
        }

        .post-edit-field label {
            display: block;
            margin-bottom: 12px;
            color: #334155;
            font-size: 15px;
            font-weight: 700;
        }

        .post-edit-input,
        .post-edit-textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 15px 17px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .post-edit-input:focus,
        .post-edit-textarea:focus {
            border-color: #2563eb;
        }

        .post-edit-textarea {
            min-height: 350px;
            resize: vertical;
            line-height: 1.8;
        }

        /* 오류 메시지 */
        .post-edit-error {
            margin-bottom: 24px;
            padding: 14px 18px;
            border: 1px solid #fecaca;
            border-radius: 9px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        /* 하단 버튼 */
        .post-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 35px;
        }

        .post-edit-cancel,
        .post-edit-submit {
            padding: 13px 25px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .post-edit-cancel {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
        }

        .post-edit-submit {
            border: none;
            background: #2563eb;
            color: #ffffff;
        }

        .post-edit-submit:hover {
            background: #1d4ed8;
        }

        /* 푸터 */
        .post-edit-footer {
            padding: 30px 20px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        /* 모바일 대응 */
        @media (max-width: 650px) {
            .post-edit-page {
                padding: 35px 16px 70px;
            }

            .post-edit-header-inner {
                flex-wrap: wrap;
            }

            .post-edit-nav {
                gap: 14px;
            }

            .post-edit-heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- 상단 메뉴 -->
    <header class="post-edit-header">
        <div class="post-edit-header-inner">

            <a class="post-edit-logo" th:href="@{/}">
                허걱슨닷컴
            </a>

            <nav class="post-edit-nav">
                <a th:href="@{/}">홈</a>
                <a th:href="@{/boards}">게시판</a>
                <a th:href="@{/}">인기글</a>
                <a th:href="@{/}">중고거래</a>
            </nav>

        </div>
    </header>

    <main class="post-edit-page">

        <!-- 게시판 이동 경로 -->
        <div class="post-edit-breadcrumb">

            <a th:href="@{/boards}">전체 게시판</a>
            &gt;

            <a th:href="@{/boards/{boardNo}(boardNo=${board.boardNo})}"
               th:text="${board.boardName}">
                게시판
            </a>

            &gt; 게시글 수정

        </div>

        <!-- 페이지 제목 -->
        <div class="post-edit-heading">
            <h1>게시글 수정</h1>
            <p>작성한 게시글의 제목과 내용을 수정할 수 있어요.</p>
        </div>

        <!-- 유효성 검사 오류 표시 -->
        <div class="post-edit-error"
             th:if="${errorMessage != null}"
             th:text="${errorMessage}">
            오류 메시지
        </div>

        <!-- 게시글 수정 폼 -->
        <form method="post"
              th:action="@{/boards/{boardNo}/posts/{postNo}/edit(
                  boardNo=${board.boardNo},
                  postNo=${post.postNo}
              )}">

            <!-- Spring Security CSRF 보호 -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- 제목 수정 -->
            <div class="post-edit-field">

                <label for="title">제목</label>

                <input type="text"
                       id="title"
                       name="title"
                       class="post-edit-input"
                       th:value="${post.title}"
                       maxlength="200"
                       required>

            </div>

            <!-- 내용 수정 -->
            <div class="post-edit-field">

                <label for="content">내용</label>

                <textarea id="content"
                          name="content"
                          class="post-edit-textarea"
                          th:text="${post.content}"
                          required></textarea>

            </div>

            <!-- 취소 및 저장 버튼 -->
            <div class="post-edit-actions">

                <a class="post-edit-cancel"
                   th:href="@{/boards/{boardNo}/posts/{postNo}(
                       boardNo=${board.boardNo},
                       postNo=${post.postNo}
                   )}">
                    취소
                </a>

                <button type="submit"
                        class="post-edit-submit">
                    수정 완료
                </button>

            </div>

        </form>

    </main>

    <footer class="post-edit-footer">
        © 2026 HEOGEOKSEUN.COM
    </footer>

</body>
</html>
