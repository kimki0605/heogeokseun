
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${board.boardName} + ' | 허걱슨닷컴'">
        게시판 | 허걱슨닷컴
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">

    <style>
        .board-detail-page {
            max-width: 1120px;
            min-height: 70vh;
            margin: 0 auto;
            padding: 55px 24px 100px;
        }

        .board-breadcrumb {
            margin-bottom: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .board-breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }

        .board-detail-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid #e2e8f0;
        }

        .board-detail-heading h1 {
            margin-bottom: 12px;
            color: #0f172a;
            font-size: 32px;
            font-weight: 800;
        }

        .board-detail-heading p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .board-write-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .board-write-button:hover {
            background: #1d4ed8;
        }

        .board-posts-title {
            margin-bottom: 18px;
            font-size: 21px;
            font-weight: 700;
            color: #111827;
        }

        .board-posts-table {
            width: 100%;
            border-collapse: collapse;
            border-top: 2px solid #334155;
            table-layout: fixed;
        }

        .board-posts-table th {
            padding: 17px 12px;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .board-posts-table td {
            padding: 19px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 14px;
            text-align: center;
        }

        .board-posts-table tbody tr:hover {
            background: #f8fafc;
        }

        .board-post-title {
            text-align: left !important;
            font-weight: 600;
            color: #1e293b;
        }

        .board-post-title span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .board-posts-empty {
            padding: 75px 20px !important;
            color: #94a3b8 !important;
            font-size: 15px !important;
            text-align: center;
        }

        .board-posts-empty strong {
            display: block;
            margin-bottom: 12px;
            color: #475569;
            font-size: 18px;
        }

        .board-detail-bottom {
            display: flex;
            justify-content: center;
            margin-top: 35px;
        }

        .board-back-button {
            padding: 12px 22px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .board-back-button:hover {
            background: #f8fafc;
        }

        .board-detail-header {
            border-bottom: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .board-detail-header-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .board-detail-logo {
            color: #2563eb;
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
        }

        .board-detail-nav {
            display: flex;
            gap: 24px;
        }

        .board-detail-nav a {
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .board-detail-nav a:hover {
            color: #2563eb;
        }

        .board-detail-footer {
            padding: 30px 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 650px) {
            .board-detail-page {
                padding: 35px 16px 70px;
            }

            .board-detail-heading {
                flex-direction: column;
                align-items: flex-start;
            }

            .board-detail-heading h1 {
                font-size: 26px;
            }

            .board-detail-header-inner {
                flex-wrap: wrap;
            }

            .board-detail-nav {
                gap: 14px;
            }

            .board-posts-table th:nth-child(1),
            .board-posts-table td:nth-child(1),
            .board-posts-table th:nth-child(4),
            .board-posts-table td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header class="board-detail-header">
        <div class="board-detail-header-inner">

            <a class="board-detail-logo" th:href="@{/}">
                허걱슨닷컴
            </a>

            <nav class="board-detail-nav">
                <a th:href="@{/}">홈</a>
                <a th:href="@{/boards}">게시판</a>
                <a th:href="@{/}">인기글</a>
                <a th:href="@{/}">중고거래</a>
            </nav>

        </div>
    </header>

    <main class="board-detail-page">

        <div class="board-breadcrumb">
            <a th:href="@{/boards}">전체 게시판</a>
            &gt;
            <span th:text="${board.boardName}">게시판 이름</span>
        </div>

        <section class="board-detail-heading">

            <div>
                <h1 th:text="${board.boardName}">일상</h1>

                <p th:text="${board.boardDescription}">
                    자유롭게 일상을 공유하는 공간
                </p>
            </div>

            <a class="board-write-button"
               th:href="@{/boards/{boardNo}/write(boardNo=${board.boardNo})}">
                글쓰기
            </a>

        </section>

        <section>

            <h2 class="board-posts-title">게시글 목록</h2>

            <table class="board-posts-table">

                <thead>
                    <tr>
                        <th style="width: 10%;">번호</th>
                        <th>제목</th>
                        <th style="width: 18%;">작성자</th>
                        <th style="width: 16%;">작성일</th>
                        <th style="width: 10%;">조회수</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="post : ${posts}">

                        <td th:text="${post.postNo}">
                            1
                        </td>

                        <td class="board-post-title">
                            <span th:text="${post.title}">
                                게시글 제목
                            </span>
                        </td>

                        <td th:text="${post.memberNo}">
                            작성자
                        </td>

                        <td th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd') : '-'}">
                            2026-10-08
                        </td>

                        <td th:text="${post.viewCount}">
                            0
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(posts)}">
                        <td colspan="5" class="board-posts-empty">
                            <strong>아직 등록된 게시글이 없습니다.</strong>
                            첫 번째 게시글을 기다리고 있어요!
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

        <div class="board-detail-bottom">
            <a class="board-back-button" th:href="@{/boards}">
                전체 게시판으로
            </a>
        </div>

    </main>

    <footer class="board-detail-footer">
        © 2026 HEOGEOKSEUN.COM
    </footer>

</body>
</html>
