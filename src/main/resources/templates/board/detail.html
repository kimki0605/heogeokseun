
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${board.boardName} + ' | 허걱슨닷컴'">
        게시판 | 허걱슨닷컴
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">

    <style>
        /* 게시판 전체 영역 */
        .board-detail-page {
            max-width: 1120px;
            min-height: 70vh;
            margin: 0 auto;
            padding: 55px 24px 100px;
        }

        /* 게시판 위치 안내 */
        .board-breadcrumb {
            margin-bottom: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .board-breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }

        /* 게시판 제목 및 글쓰기 */
        .board-detail-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid #e2e8f0;
        }

        .board-detail-heading h1 {
            margin-bottom: 12px;
            color: #0f172a;
            font-size: 32px;
            font-weight: 800;
        }

        .board-detail-heading p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .board-write-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .board-write-button:hover {
            background: #1d4ed8;
        }

        /* 게시글 목록 제목 */
        .board-posts-title {
            margin-bottom: 18px;
            font-size: 21px;
            font-weight: 700;
            color: #111827;
        }

        /* 게시글 목록 테이블 */
        .board-posts-table {
            width: 100%;
            border-collapse: collapse;
            border-top: 2px solid #334155;
            table-layout: fixed;
        }

        .board-posts-table th {
            padding: 17px 12px;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .board-posts-table td {
            padding: 19px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 14px;
            text-align: center;
        }

        .board-posts-table tbody tr:hover {
            background: #f8fafc;
        }

        .board-post-title {
            text-align: left !important;
            font-weight: 600;
            color: #1e293b;
        }

        .post-title-link {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #1e293b;
            font-weight: 600;
            text-decoration: none;
        }

        .post-title-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        /* 게시글이 없을 때 */
        .board-posts-empty {
            padding: 75px 20px !important;
            color: #94a3b8 !important;
            font-size: 15px !important;
            text-align: center;
        }

        .board-posts-empty strong {
            display: block;
            margin-bottom: 12px;
            color: #475569;
            font-size: 18px;
        }

        /* ========================================
           게시글 검색 영역
           ======================================== */
        .board-search-area {
            display: flex;
            justify-content: center;
            margin-top: 32px;
        }

        .board-search-form {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }

        .board-search-select {
            height: 44px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            outline: none;
        }

        .board-search-input {
            width: 320px;
            max-width: 100%;
            height: 44px;
            padding: 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            outline: none;
        }

        .board-search-input:focus,
        .board-search-select:focus {
            border-color: #2563eb;
        }

        .board-search-button {
            height: 44px;
            padding: 0 22px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .board-search-button:hover {
            background: #1d4ed8;
        }

        .board-search-reset {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .board-search-reset:hover {
            background: #f8fafc;
        }

        /* 검색 결과 안내 */
        .board-search-result {
            margin-bottom: 18px;
            color: #64748b;
            font-size: 14px;
        }

        .board-search-result strong {
            color: #2563eb;
        }

        /* 게시판 목록으로 돌아가기 */
        .board-detail-bottom {
            display: flex;
            justify-content: center;
            margin-top: 35px;
        }

        .board-back-button {
            padding: 12px 22px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .board-back-button:hover {
            background: #f8fafc;
        }

        /* 상단 헤더 */
        .board-detail-header {
            border-bottom: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .board-detail-header-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .board-detail-logo {
            color: #2563eb;
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
        }

        .board-detail-nav {
            display: flex;
            gap: 24px;
        }

        .board-detail-nav a {
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .board-detail-nav a:hover {
            color: #2563eb;
        }

        /* 하단 푸터 */
        .board-detail-footer {
            padding: 30px 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 650px) {
            .board-detail-page {
                padding: 35px 16px 70px;
            }

            .board-detail-heading {
                flex-direction: column;
                align-items: flex-start;
            }

            .board-detail-heading h1 {
                font-size: 26px;
            }

            .board-detail-header-inner {
                flex-wrap: wrap;
            }

            .board-detail-nav {
                gap: 14px;
            }

            .board-posts-table th:nth-child(1),
            .board-posts-table td:nth-child(1),
            .board-posts-table th:nth-child(4),
            .board-posts-table td:nth-child(4) {
                display: none;
            }

            .board-search-form {
                justify-content: stretch;
            }

            .board-search-select {
                flex: 1;
            }

            .board-search-input {
                width: 100%;
                flex-basis: 100%;
            }

            .board-search-button,
            .board-search-reset {
                flex: 1;
            }
        }
        
        
		/* ========================================
   		게시글 페이징 버튼 디자인
   		======================================== */
		.board-pagination {
    		display: flex;
    		justify-content: center;
    		align-items: center;
    		flex-wrap: wrap;
    		gap: 8px;
    		margin-top: 32px;
		}

		.board-pagination a {
		    display: inline-flex;
		    justify-content: center;
		    align-items: center;
		    min-width: 40px;
		    height: 40px;
		    padding: 0 12px;
		    border: 1px solid #cbd5e1;
		    border-radius: 9px;
		    background: #ffffff;
		    color: #334155;
		    font-size: 14px;
		    font-weight: 600;
		    text-decoration: none;
		    transition: 0.2s;
		}
		
		.board-pagination a:hover {
		    border-color: #2563eb;
		    color: #2563eb;
		}
		
		.board-pagination a.active {
		    border-color: #2563eb;
		    background: #2563eb;
		    color: #ffffff;
		}
        
    </style>
</head>

<body>

    <!-- ========================================
         사이트 상단 헤더
         ======================================== -->
    <header class="board-detail-header">
        <div class="board-detail-header-inner">

            <a class="board-detail-logo" th:href="@{/}">
                허걱슨닷컴
            </a>

            <nav class="board-detail-nav">
                <a th:href="@{/}">홈</a>
                <a th:href="@{/boards}">게시판</a>
                <a th:href="@{/}">인기글</a>
                <a th:href="@{/}">중고거래</a>
            </nav>

        </div>
    </header>

    <!-- ========================================
         게시판 메인 영역
         ======================================== -->
    <main class="board-detail-page">

        <!-- 현재 게시판 위치 -->
        <div class="board-breadcrumb">
            <a th:href="@{/boards}">전체 게시판</a>
            &gt;
            <span th:text="${board.boardName}">
                게시판 이름
            </span>
        </div>

        <!-- 게시판 이름과 글쓰기 버튼 -->
        <section class="board-detail-heading">

            <div>
                <h1 th:text="${board.boardName}">
                    일상
                </h1>

                <p th:text="${board.boardDescription}">
                    자유롭게 일상을 공유하는 공간
                </p>
            </div>

            <a class="board-write-button"
               th:href="@{/boards/{boardNo}/write(boardNo=${board.boardNo})}">
                글쓰기
            </a>

        </section>

        <!-- ========================================
             게시글 목록
             ======================================== -->
        <section>

            <h2 class="board-posts-title">
                게시글 목록
            </h2>

            <!-- 검색한 경우 검색어와 결과 개수 표시 -->
            <div class="board-search-result"
                 th:if="${isSearch}">

                '<strong th:text="${keyword}">검색어</strong>'
                검색 결과
                <strong th:text="${#lists.size(posts)}">0</strong>건

            </div>

            <table class="board-posts-table">

                <thead>
                    <tr>
                        <th style="width: 10%;">번호</th>
                        <th>제목</th>
                        <th style="width: 18%;">작성자</th>
                        <th style="width: 16%;">작성일</th>
                        <th style="width: 10%;">조회수</th>
                    </tr>
                </thead>

                <tbody>

                    <!-- 게시글 목록 출력 -->
                    <tr th:each="post : ${posts}">

                        <td th:text="${post.postNo}">
                            1
                        </td>

                        <!-- 게시글 상세 페이지로 이동 -->
                        <td class="board-post-title">

                            <a class="post-title-link"
                               th:href="@{/boards/{boardNo}/posts/{postNo}(
                                   boardNo=${board.boardNo},
                                   postNo=${post.postNo}
                               )}"
                               th:text="${post.title}">

                                게시글 제목

                            </a>

                        </td>

                        <!-- 작성자 닉네임 -->
                        <td th:text="${post.authorNickname != null ? post.authorNickname : '알 수 없는 사용자'}">
                            작성자 닉네임
                        </td>

                        <!-- 작성일 -->
                        <td th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd') : '-'}">
                            2026-10-08
                        </td>

                        <!-- 조회수 -->
                        <td th:text="${post.viewCount}">
                            0
                        </td>

                    </tr>

                    <!-- 검색 결과 또는 게시글이 없는 경우 -->
                    <tr th:if="${#lists.isEmpty(posts)}">

                        <td colspan="5" class="board-posts-empty">

                            <!-- 검색했지만 결과가 없는 경우 -->
                            <th:block th:if="${isSearch}">

                                <strong>
                                    검색 결과가 없습니다.
                                </strong>

                                다른 검색어로 다시 검색해 보세요!

                            </th:block>

                            <!-- 게시판에 글이 없는 경우 -->
                            <th:block th:unless="${isSearch}">

                                <strong>
                                    아직 등록된 게시글이 없습니다.
                                </strong>

                                첫 번째 게시글을 기다리고 있어요!

                            </th:block>

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>
        
        
        <!-- ========================================
             게시글 페이지 이동 버튼
             ======================================== -->
        <nav class="board-pagination"
             aria-label="게시글 페이지 이동"
             th:if="${totalPages > 1}">

            <!-- 이전 페이지 -->
            <a th:if="${hasPrevious}"
               th:href="@{/boards/{boardNo}(
                   boardNo=${board.boardNo},
                   page=${currentPage - 1},
                   searchType=${searchType},
                   keyword=${keyword}
               )}">
                이전
            </a>

            <!-- 페이지 번호 -->
            <a th:each="pageNo : ${#numbers.sequence(startPage, endPage)}"
               th:href="@{/boards/{boardNo}(
                   boardNo=${board.boardNo},
                   page=${pageNo},
                   searchType=${searchType},
                   keyword=${keyword}
               )}"
               th:text="${pageNo}"
               th:classappend="${pageNo == currentPage} ? ' active' : ''">
                1
            </a>

            <!-- 다음 페이지 -->
            <a th:if="${hasNext}"
               th:href="@{/boards/{boardNo}(
                   boardNo=${board.boardNo},
                   page=${currentPage + 1},
                   searchType=${searchType},
                   keyword=${keyword}
               )}">
                다음
            </a>

        </nav>
        

        <!-- ========================================
             게시글 검색창
             GET 방식으로 BoardController에 전달
             ======================================== -->
        <section class="board-search-area">

            <form class="board-search-form"
                  method="get"
                  th:action="@{/boards/{boardNo}(boardNo=${board.boardNo})}">

                <!-- 검색 유형 -->
                <select class="board-search-select"
                        name="searchType"
                        aria-label="검색 유형">

                    <option value="title"
                            th:selected="${searchType == 'title'}">
                        제목
                    </option>

                    <option value="all"
                            th:selected="${searchType == 'all'}">
                        제목 + 내용
                    </option>

                </select>

                <!-- 검색어 입력 -->
                <input type="search"
                       class="board-search-input"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="검색어를 입력하세요"
                       aria-label="게시글 검색어"
                       maxlength="100"
                       required>

                <!-- 검색 실행 -->
                <button type="submit"
                        class="board-search-button">
                    검색
                </button>

                <!-- 검색 조건 초기화 -->
                <a class="board-search-reset"
                   th:href="@{/boards/{boardNo}(boardNo=${board.boardNo})}">
                    전체 글 보기
                </a>

            </form>

        </section>

        <!-- 전체 게시판 목록으로 이동 -->
        <div class="board-detail-bottom">

            <a class="board-back-button"
               th:href="@{/boards}">
                전체 게시판으로
            </a>

        </div>

    </main>

    <!-- 사이트 푸터 -->
    <footer class="board-detail-footer">
        © 2026 HEOGEOKSEUN.COM
    </footer>

</body>
</html>
